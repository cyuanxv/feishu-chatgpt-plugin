name: Sites full plan
on:
  pull_request:
    paths: ['snapshots/sites-adapter-0.1.0-sites.8/**', '.github/workflows/sites-full-plan.yml']
  push:
    branches: [main]
    paths: ['snapshots/sites-adapter-0.1.0-sites.8/**', '.github/workflows/sites-full-plan.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snapshots/sites-adapter-0.1.0-sites.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snapshots/sites-adapter-0.1.0-sites.8/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:source
      - run: npm run check:package
      - run: npm ci --prefix runtime-check
      - run: npm run check:workerd
